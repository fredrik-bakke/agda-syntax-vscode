        while: (^|\G)(?:\2(?=\s)|\s*$)
        name: meta.block.abstract.agda
        beginCaptures:
          3: { name: keyword.control.abstract.agda }
        patterns:
          - include: "#the_usual"
 # TODO: do, let
      - comment: field block #TODO: continue working on this
        begin: (^|\G|(?<=;))(\s*)(field)(?=$|\!\}|[\s;{}()@".])
        while: (^|\G)(?:\2(?=\s)|\s*$)
        name: meta.block.field.agda
        beginCaptures:
