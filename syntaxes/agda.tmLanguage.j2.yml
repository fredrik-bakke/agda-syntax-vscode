$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
comment: This TextMate Grammar file has been generated from a Jinja2 YAML template.
name: Agda
scopeName: source.agda
fileTypes: [agda]
keyEquivalent: ^~A

{% set NAME_QUALIFIED_BOUNDARY_CHARS = '\s;{}()@"' %}
{% set TOKEN_BOUNDARY_CHARS = NAME_QUALIFIED_BOUNDARY_CHARS + '.' %}
{% set NAME_PART_BOUNDARY_CHARS = TOKEN_BOUNDARY_CHARS + '_' %}

{% set name_qualified_boundary_char = '[' + NAME_QUALIFIED_BOUNDARY_CHARS + ']' %}
{% set token_boundary_char = '[' + TOKEN_BOUNDARY_CHARS + ']' %}
{% set name_part_boundary_char = '[' + NAME_PART_BOUNDARY_CHARS + ']' %}

{% set name_qualified_boundary_start = '(?<=^|\{\!|\{-\#|' + name_qualified_boundary_char + ')' %}
{% set name_qualified_boundary_end = '(?=$|\!\}|' + name_qualified_boundary_char + ')' %}
{% set token_boundary_start = '(?<=^|\{\!|\{-\#|' + token_boundary_char + ')' %}
{% set token_boundary_end = '(?=$|\!\}|' + token_boundary_char + ')' %}
{% set name_part_boundary_start = '(?<=^|\{\!|\{-\#|' + name_part_boundary_char + ')' %}
{% set name_part_boundary_end = '(?=$|\!\}|' + name_part_boundary_char + ')' %}

{% macro name_qualified_boundary(s) %}{{ name_qualified_boundary_start }}{{ s }}{{ name_qualified_boundary_end }}{% endmacro %}
{% macro token_boundary(s) %}{{ token_boundary_start }}{{ s }}{{ token_boundary_end }}{% endmacro %}
{% macro name_part_boundary(s) %}{{ name_part_boundary_start }}{{ s }}{{ name_part_boundary_end }}{% endmacro %}

{% set statement_boundary_start = '(^|\G|(?<=;))' %}
{% set statement_boundary_end = '(?=;)' %}
{% set DECLARATION_SEPARATOR = token_boundary('[:=]') %}
{% set ARROW_TOKEN = token_boundary('(?:->|→)') %}
{% set LAMBDA_TOKEN = token_boundary('(?:\\\\|λ)') %}
{% set FORALL_TOKEN = token_boundary('(?:forall|∀)') %}
{% set INSTANCE_ARGUMENT_START = token_boundary('⦃') %}
{% set INSTANCE_ARGUMENT_END = token_boundary('⦄') %}
{% set PARAMETER_START = '(?:[({]|' + INSTANCE_ARGUMENT_START + ')' %}
{% set VARIABLE_SIGNATURE_CHAR = '(?:[^\\n:)}⦄]|(?<!^|' + token_boundary_char + ')[:⦄]|[:⦄](?!$|' + token_boundary_char + '))' %}

{% set NUMERIC_INTEGER = '-?(?:0[xX]\h+|0[bB][01]+|[0-9]+(?:_[0-9]+)*)' %}
{% set NUMERIC_FLOAT = '-?(?:[0-9]+\.[0-9]+(?:[eE][+-]?[0-9]+)?|[0-9]+[eE][+-]?[0-9]+)' %}
{% set NUMERIC_LITERAL = '(?:' + NUMERIC_FLOAT + '|' + NUMERIC_INTEGER + ')' %}
{% set ESCAPE_CODE = '[0-9]+|0[xX]\h+|a|b|t|n|v|f|\\\\|\'|"|NUL|SOH|STX|ETX|EOT|ENQ|ACK|BEL|BS|HT|LF|VT|FF|CR|SO|SI|DLE|DC1|DC2|DC3|DC4|NAK|SYN|ETB|CAN|EM|SUB|ESC|FS|GS|RS|US|SP|DEL' %}
{% set ESCAPE_CONTROL_CODE = '\^[A-Z@\[\]\\\^_]' %}
{% set STRING_CONTINUATION_START = '\\\\(?:\s*\\\\|' + ESCAPE_CODE + '|' + ESCAPE_CONTROL_CODE + ')' %}
{% set DECLARATION_START_KEYWORD = '(?:open|abstract|constructor|data|field|infix[lr]?|instance|macro|module|mutual|opaque|postulate|primitive|private|record|variable|where)' %}
{% set RESERVED_NAME_PART = '(?:abstract|(co)?inductive|data|do|(no-)?eta-equality|field|forall|hiding|import|in|infix[lr]?|instance|interleaved|let|macro|module|mutual|opaque|open|overlap|pattern|postulate|primitive|private|public|quote(Term)?|record|renaming|rewrite|syntax|tactic|unquote(Decl|Def)?|unfolding|using|variable|where|with)' %}
{% set NAME_PART = '(?!\'|--)(?!' + NUMERIC_LITERAL + '(?=$|' + name_part_boundary_char + '))[^' + NAME_PART_BOUNDARY_CHARS + ']+' %}
{% set name_part = name_part_boundary(NAME_PART) %}
{% set NAME_TOKEN = '_?' + NAME_PART + '(_' + NAME_PART + ')*_?' %}
{% set name_token = token_boundary(NAME_TOKEN) %}
{% set NAME_QUALIFIED = NAME_TOKEN + '(\.' + NAME_TOKEN + ')*' %}
{% set name_qualified = name_qualified_boundary(NAME_QUALIFIED) %}
{% set IMPORTED_MODULE_CONTINUATION = 'module\s+' + NAME_QUALIFIED + '\s*(?=[);]|to' + token_boundary_end + ')' %}
{% set AGDA_MODALITY = '(?:irr|irrelevant|shirr|shape-irrelevant|relevant|0|erased|ω|♭|\+\+|\+|-|mixed|unused)' %}
{% set BINDER_LABEL = '(?!' + DECLARATION_SEPARATOR + ')(?!(?:constructor|' + RESERVED_NAME_PART + ')' + token_boundary_end + ')(?:' + NAME_TOKEN + '|_)' %}
{% set BINDER_LABELS = '(?:(?:\.|@' + AGDA_MODALITY + ')\s*)*' + BINDER_LABEL + '(?:\s+' + BINDER_LABEL + ')*' %}
{% set HIDDEN_SIGNATURE_NAME = '(?:\{\{\s*' + BINDER_LABELS + '\s*\}\}|\{\s*' + BINDER_LABELS + '\s*\}|' + INSTANCE_ARGUMENT_START + '\s*' + BINDER_LABELS + '\s*' + INSTANCE_ARGUMENT_END + ')' %}
{% set BINDER_CHAR = '[^():{}\\n]' %}
{% set BINDER_GROUP = '(?:\(' + BINDER_CHAR + '*\)|\{' + BINDER_CHAR + '*\}|' + INSTANCE_ARGUMENT_START + BINDER_CHAR + '*' + INSTANCE_ARGUMENT_END + ')' %}
{% set BINDER_NESTED_GROUP = '\((?:' + BINDER_CHAR + '|' + BINDER_GROUP + ')*\)' %}
{% set TYPED_PARAMETER_PATTERN = '\s*(?:(?!\s+' + ARROW_TOKEN + '|' + LAMBDA_TOKEN + ')(?:' + BINDER_CHAR + '|' + BINDER_NESTED_GROUP + '|' + BINDER_GROUP + '))*\s*' %}

{% set absurd_pattern = '\(\s*\)' %}

patterns:
  - include: "#the_usual"

repository:
  data_record_telescope:
    begin: \G
    end: (?={{ token_boundary('(?::|where)') }})
    patterns:
      - include: "#declaration_telescope"

  declaration_telescope:
    patterns:
      - include: "#agda_comments"
      - include: "#multiline_parameter_declaration"
      - include: "#binder_declaration"
      - include: "#telescope_local_declaration"
      - include: "#typed_parameter_parenthesized_expression"
      - include: "#agda_modality"
      - include: "#agda_attributes"
      - include: "#visible_untyped_parameter_declaration"
      - include: "#agda_syntax"

  local_module_declaration:
    match: {{ token_boundary('(?:(open)(\s+))?(module)') }}(\s+)({{ NAME_QUALIFIED }})(\s*){{ token_boundary('(=)') }}
    captures:
      1: { name: keyword.control.import.agda }
      3: { name: keyword.control.module.agda }
      5:
        name: entity.name.namespace.agda
        patterns:
          - include: "#qualified_name"
      7: { name: keyword.operator.assignment.agda }

  local_open_declaration:
    match: {{ token_boundary('(open)') }}(\s+)({{ NAME_QUALIFIED }})
    captures:
      1: { name: keyword.control.import.agda }
      3:
        name: entity.name.namespace.agda
        patterns:
          - include: "#qualified_name"

  telescope_local_declaration:
    begin: (\()(?=\s*(?:let|open){{ token_boundary_end }})
    end: \)
    beginCaptures: { 1: { name: punctuation.section.parens.begin.agda } }
    endCaptures: { 0: { name: punctuation.section.parens.end.agda } }
    patterns:
      - match: \G(\s*)(let){{ token_boundary_end }}
        captures: { 2: { name: keyword.control.agda } }
      - include: "#telescope_term"

  telescope_term_parenthesized_expression:
    begin: \(
    end: \)
    patterns:
      - include: "#telescope_term"

  telescope_term:
    patterns:
      - include: "#agda_comments"
      - include: "#import_directive"
      - include: "#local_module_declaration"
      - include: "#local_open_declaration"
      - include: "#type_let_expression"
      - include: "#telescope_local_declaration"
      - include: "#telescope_term_parenthesized_expression"
      - include: "#agda_syntax"
      - include: "#agda_token"

  type_let_expression:
    begin: {{ token_boundary('(let)') }}
    end: {{ token_boundary('(in)') }}
    beginCaptures: { 1: { name: keyword.control.agda } }
    endCaptures: { 1: { name: keyword.control.agda } }
    patterns:
      - include: "#telescope_term"

  visible_untyped_parameter_declaration:
    match: (\s*){{ token_boundary_start }}(?!{{ PARAMETER_START }})(?!(?:{{ DECLARATION_START_KEYWORD }}|module){{ token_boundary_end }})({{ BINDER_LABELS }})(?=\s*(?:{{ PARAMETER_START }}|{{ token_boundary('(?::|where|=)') }}))
    captures:
      2:
        name: meta.declaration.parameters.explicit.pattern.agda
        patterns:
          - include: "#agda_modality"
          - include: "#variable_label"

  module_declaration:
    contentName: meta.declaration.module.agda
    begin: {{ statement_boundary_start }}(\s*)(module){{ token_boundary_end }}
    end: {{ token_boundary('(where)') }}|{{ token_boundary('(=)') }}|{{ statement_boundary_end }}|^(?!\2\s) #TODO: when we make this into a block, this will be a new begin instead of an end
    beginCaptures:
      3: { name: keyword.control.module.agda }
    endCaptures:
      1: { name: keyword.control.where.module.agda }
      2: { name: keyword.operator.assignment.agda }
    patterns:
      - include: "#agda_comments"
      - begin: (?:\G\s*|^\s+)({{ NAME_QUALIFIED }}|_){{ token_boundary_end }}
        end: (?={{ token_boundary('(where)') }}|{{ token_boundary('(=)') }})
        beginCaptures:
          1:
            name: entity.name.namespace.agda
            patterns:
              - include: "#module_label"
        contentName: meta.declaration.parameters.module.agda
        patterns:
          - include: "#declaration_telescope"

  data_declaration:
    name: meta.declaration.data.agda
    contentName: meta.declaration.parameters.data.agda
    begin: {{ statement_boundary_start }}(\s*)(data)\s+({{ NAME_TOKEN }}|_){{ token_boundary_end }}
    end: (?:^\s*)?({{ token_boundary('where') }})|{{ statement_boundary_end }}|^(?=\2\S)
    beginCaptures:
      3: { name: storage.type.class.data.agda }
      4:
        name: entity.name.type.data.agda
        patterns:
          - include: "#qualified_name"
    endCaptures:
      1: { name: keyword.control.where.data.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#data_record_telescope"
      - include: "#type"
      - include: "#agda_syntax"

  data_declaration_name_on_separate_line:
    name: meta.declaration.data.agda
    contentName: meta.declaration.parameters.data.agda
    begin: {{ statement_boundary_start }}(\s*)(data)\s*$
    end: (?:^\s*)?({{ token_boundary('where') }})|{{ statement_boundary_end }}|^(?=\2\S)
    beginCaptures:
      3: { name: storage.type.class.data.agda }
    endCaptures:
      1: { name: keyword.control.where.data.agda }
    patterns:
      - include: "#agda_comments"
      - begin: ^(\s+)({{ NAME_TOKEN }}|_){{ token_boundary_end }}
        end: (?={{ token_boundary('(?::|where)') }})
        beginCaptures:
          2:
            name: entity.name.type.data.agda
            patterns:
              - include: "#qualified_name"
        patterns:
          - include: "#declaration_telescope"
      - include: "#type"
      - include: "#agda_syntax"

  record_declaration:
    name: meta.declaration.record.agda
    contentName: meta.declaration.parameters.record.agda
    begin: {{ statement_boundary_start }}(\s*)(record){{ token_boundary_end }}(?!\s*(?:\{|where{{ token_boundary_end }}))\s+({{ NAME_TOKEN }}|_){{ token_boundary_end }}
    end: (?:^\s*)?({{ token_boundary('where') }})|{{ statement_boundary_end }}|^(?=\2\S)
    beginCaptures:
      3: { name: storage.type.class.record.agda }
      4:
        name: entity.name.type.record.agda
        patterns:
          - include: "#qualified_name"
    endCaptures:
      1: { name: keyword.control.where.record.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#data_record_telescope"
      - include: "#type"
      - include: "#agda_syntax"

  record_declaration_name_on_separate_line:
    name: meta.declaration.record.agda
    contentName: meta.declaration.parameters.record.agda
    begin: {{ statement_boundary_start }}(\s*)(record)\s*$
    end: (?:^\s*)?({{ token_boundary('where') }})|{{ statement_boundary_end }}|^(?=\s*\{)|^(?=\2\S)
    beginCaptures:
      3: { name: storage.type.class.record.agda }
    endCaptures:
      1: { name: keyword.control.where.record.agda }
    patterns:
      - include: "#agda_comments"
      - begin: ^(\s+)(?!\s*(?:where|:){{ token_boundary_end }})({{ NAME_TOKEN }}|_){{ token_boundary_end }}
        end: (?={{ token_boundary('(?::|where)') }})
        beginCaptures:
          2:
            name: entity.name.type.record.agda
            patterns:
              - include: "#qualified_name"
        patterns:
          - include: "#declaration_telescope"
      - include: "#type"
      - include: "#agda_syntax"

  open_statement_content:
    patterns:
      - include: "#agda_comments"
      - include: "#parameter_declaration"
      - include: "#import_directive"
      - include: "#open_module_statement"
      - include: "#open_import_statement"
      - include: "#open_statement"

  open_as_clause:
    patterns:
      - match: {{ token_boundary('(as)') }}(\s+)({{ NAME_QUALIFIED }}){{ token_boundary_end }}
        captures:
          1: { name: keyword.other.as.agda }
          3:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"
      - match: {{ token_boundary('as') }}
        name: keyword.other.as.agda

  open_module_statement:
    begin: {{ statement_boundary_start }}(\s*)(open){{ token_boundary_end }}(\s+)(module){{ token_boundary_end }}(\s+)({{ NAME_QUALIFIED }})
    beginCaptures:
      3: { name: keyword.control.import.agda }
      5: { name: keyword.control.module.agda }
      7:
        name: entity.name.namespace.agda
        patterns:
          - include: "#qualified_name"
    while: (^|\G)\2(?=\s)(?:(?=\s*{{ IMPORTED_MODULE_CONTINUATION }})|(?!\s*{{ DECLARATION_START_KEYWORD }}{{ token_boundary_end }}))
    patterns:
      - include: "#open_statement_content"
      - include: "#open_as_clause"
      - include: "#agda_syntax"
      - include: "#agda_token"

  open_import_statement:
    begin: {{ statement_boundary_start }}(\s*)(import|open\s+import)(?=$|\s)(\s*)({{ NAME_QUALIFIED }})?
    beginCaptures:
      3: { name: keyword.control.import.agda }
      5:
        name: entity.name.namespace.agda
        patterns:
          - include: "#qualified_name"
    while: (^|\G)\2(?=\s)(?:(?=\s*{{ IMPORTED_MODULE_CONTINUATION }})|(?!\s*{{ DECLARATION_START_KEYWORD }}{{ token_boundary_end }}))
    patterns:
      - include: "#open_statement_content"
      - include: "#open_as_clause"
      - match: {{ token_boundary('public') }}
        name: keyword.control.import.agda
      - match: {{ token_boundary('module') }}
        name: invalid.illegal.name.part.keyword.agda
      - match: (?:^|\G)(?<!\S)(?=\s*(?!\{|{{ INSTANCE_ARGUMENT_START }})\S)\s*(?!(?:module|record|using|hiding|renaming|as|public|in){{ token_boundary_end }})({{ NAME_QUALIFIED }})
        captures:
          1:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"
      - include: "#agda_syntax"
      - include: "#agda_token"

  open_statement:
    begin: {{ statement_boundary_start }}(\s*)(open)(?=$|\s)(?!\s+import{{ token_boundary_end }})(\s*)({{ NAME_QUALIFIED }})?
    beginCaptures:
      3: { name: keyword.control.import.agda }
      5:
        name: entity.name.namespace.agda
        patterns:
          - include: "#qualified_name"
    while: (^|\G)\2(?=\s)(?:(?=\s*{{ IMPORTED_MODULE_CONTINUATION }})|(?!\s*{{ DECLARATION_START_KEYWORD }}{{ token_boundary_end }}))
    patterns:
      - include: "#open_statement_content"
      - match: {{ token_boundary('(import)') }}(\s+)({{ NAME_QUALIFIED }})
        captures:
          1: { name: keyword.control.import.agda }
          3:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"
      - match: {{ token_boundary('import') }}
        name: keyword.control.import.agda
      - match: {{ token_boundary('(module)') }}(\s+)({{ NAME_QUALIFIED }})(?=\s*{{ token_boundary('=') }})
        captures:
          1: { name: keyword.control.module.agda }
          3:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"
      - match: {{ token_boundary('module') }}
        name: invalid.illegal.name.part.keyword.agda
      - match: =
        name: keyword.operator.agda
      - match: (?:^|\G)(?<!\S)(?=\s*(?!\{|{{ INSTANCE_ARGUMENT_START }})\S)\s*(?!(?:import|module|record|using|hiding|renaming|as|public|in){{ token_boundary_end }})({{ NAME_QUALIFIED }})
        captures:
          1:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"
      - include: "#open_as_clause"
      - include: "#agda_syntax"
      - include: "#agda_token"

  import_directive:
    begin: {{ token_boundary_start }}(using|hiding|renaming)(?:\s*(\())?
    beginCaptures:
      1: { name: keyword.control.import.agda }
      2: { name: punctuation.section.parens.begin.agda }
    end: \)
    endCaptures:
      0: { name: punctuation.section.parens.end.agda }
    name: meta.statement.import.names.agda
    patterns:
      - include: "#agda_comments"
      - match: {{ token_boundary('module') }}
        name: keyword.control.module.agda
      - match: {{ token_boundary('to') }}
        name: keyword.other.to.agda
      - match: {{ token_boundary('infix[lr]?') }}
        name: keyword.control.infix.agda
      - include: "#agda_literals"
      - include: "#term_name"

  infix_block:
    begin: {{ statement_boundary_start }}(\s*)(infix[lr]?){{ token_boundary_end }}
    while: (^|\G)\2(?=\s)
    beginCaptures:
      3: { name: keyword.control.infix.agda }
    name: meta.statement.infix.agda
    contentName: meta.declaration.infix.arguments.agda
    patterns:
      - include: "#agda_comments"
      - include: "#agda_literals"
      - include: "#term_name"

  constructor_block:
    begin: ^(\s*)(constructor){{ token_boundary_end }}
    while: (^|\G)\1(?=\s)
    beginCaptures:
      2: { name: keyword.control.constructor.agda }
    name: meta.statement.constructor.agda
    patterns:
      - include: "#agda_comments"
      - include: "#agda_literals"
      - include: "#term_name"

  binder_declaration:
    patterns:
      - include: "#implicit_untyped_parameter_declaration"
      - include: "#instance_double_brace_untyped_parameter_declaration"
      - include: "#instance_unicode_untyped_parameter_declaration"
      - include: "#parameter_declaration"

  parameter_declaration:
    patterns:
      - include: "#forall_abstraction_start"
      - include: "#typed_parameter_declaration"
      - include: "#implicit_parameter_declaration"
      - include: "#instance_double_brace_parameter_declaration"
      - include: "#instance_unicode_parameter_declaration"

{% for param_decl in [
  {"id": "implicit", "begin": "\\{(?!-)(?![^:\\n{}]*" + ARROW_TOKEN + ")", "end": "(?<!-)\\}", "body": "[^}\\n]", "head": "[^:}\\n]", "inner": "(?:[{()]|" + INSTANCE_ARGUMENT_START + "|" + INSTANCE_ARGUMENT_END + "|" + FORALL_TOKEN + ")"},
  {"id": "instance_double_brace", "begin": "\\{\\{(?!-)(?![^:\\n{}]*" + ARROW_TOKEN + ")", "end": "(?<!-)\\}\\}", "body": "[^}\\n]", "head": "[^:}\\n]", "inner": "(?:[{()]|" + INSTANCE_ARGUMENT_START + "|" + INSTANCE_ARGUMENT_END + "|" + FORALL_TOKEN + ")"},
  {"id": "instance_unicode", "begin": INSTANCE_ARGUMENT_START, "end": INSTANCE_ARGUMENT_END, "body": "(?:(?!" + INSTANCE_ARGUMENT_END + ")[^\\n])", "head": "(?:(?!" + INSTANCE_ARGUMENT_END + ")[^:\\n])", "inner": "(?:[{}()]|" + INSTANCE_ARGUMENT_START + "|" + FORALL_TOKEN + ")"}
] %}
  {{ param_decl.id }}_parameter_declaration:
    begin: {{ param_decl.begin }}
    end: {{ param_decl.end }}
    beginCaptures:
      0: { name: punctuation.section.parens.{{ param_decl.id }}.begin.agda }
    endCaptures:
      0: { name: punctuation.section.parens.{{ param_decl.id }}.end.agda }
    name: meta.declaration.parameters.{{ param_decl.id }}.agda
    patterns:
      - include: "#variable_type_signature"
      - include: "#agda_syntax" # TODO: refine
      - include: "#parameter_declaration"
      - include: "#type"

  {{ param_decl.id }}_untyped_parameter_declaration:
    begin: {{ param_decl.begin }}(?!{{ param_decl.body }}*{{ DECLARATION_SEPARATOR }})(?!{{ param_decl.head }}*{{ ARROW_TOKEN }})(?!{{ param_decl.body }}*{{ param_decl.inner }})(?=\s*{{ BINDER_LABELS }}\s*{{ param_decl.end }})
    end: {{ param_decl.end }}
    name: meta.declaration.parameters.{{ param_decl.id }}.agda
    beginCaptures:
      0: { name: punctuation.section.parens.{{ param_decl.id }}.begin.agda }
    endCaptures:
      0: { name: punctuation.section.parens.{{ param_decl.id }}.end.agda }
    contentName: meta.declaration.parameters.{{ param_decl.id }}.pattern.agda
    patterns:
      - include: "#variable_label"
      - include: "#agda_syntax"
{% endfor %}

  variable_type_signature:
    match: (^|\G)(?!{{ VARIABLE_SIGNATURE_CHAR }}*{{ token_boundary('=') }})(?!{{ VARIABLE_SIGNATURE_CHAR }}*{{ ARROW_TOKEN }})(?!\s*{{ PARAMETER_START }})(({{ VARIABLE_SIGNATURE_CHAR }})+){{ token_boundary_char }}(:){{ token_boundary_end }}
    name: meta.declaration.variable_type_signature.agda
    captures:
      2:
        patterns:
          - include: "#agda_syntax"
          - include: "#variable_label"
          - match: \s+
          - name: invalid.name.variable.agda
            match: {{ token_boundary('((?!\.)' + token_boundary_char + ')+') }}
      4: { name: keyword.operator.colon.agda }

  type:
    patterns:
      - include: "#type_let_expression"
      - include: "#parameter_declaration"
      - include: "#agda_syntax"
      - include: "#type_token"

  type_token:
    match: {{ name_qualified_boundary('(' + NAME_QUALIFIED + '|_)') }}
    captures:
      1:
        patterns:
          - include: "#agda_syntax"
          - include: "#agda_builtin"
          - include: "#lambda_abstraction_start"
          - include: "#wildcard"
          - name: storage.type.qualified.agda
            match: {{ name_qualified }}
            captures:
              0:
                patterns:
                  - include: "#qualified_name"
          - name: invalid.name.type.token.agda
            match: {{ token_boundary('((?!\.)' + token_boundary_char + ')+') }}

  hidden_argument_type_signature:
    begin: {{ statement_boundary_start }}(\s*)(?={{ HIDDEN_SIGNATURE_NAME }}\s*{{ token_boundary(':') }})
    while: (^|\G)\2(?=\s)
    name: meta.declaration.function.agda
    patterns:
      - match: {{ HIDDEN_SIGNATURE_NAME }}(?=\s*{{ token_boundary(':') }})
        captures:
          0:
            patterns:
              - name: punctuation.section.parens.agda
                match: \{\{|\}\}|[{}]|{{ INSTANCE_ARGUMENT_START }}|{{ INSTANCE_ARGUMENT_END }}
              - include: "#agda_modality"
              - include: "#term_name"
      - match: {{ token_boundary('(:)') }}
        name: keyword.operator.colon.agda
      - include: "#type"

  term_type_signature_content:
    patterns:
      - include: "#open_module_statement"
      - include: "#open_import_statement"
      - include: "#open_statement"
      - include: "#type"

  term_type_signature_colon_on_first_line:
    begin: {{ statement_boundary_start }}(\s*)(?![^\n:]*{{ token_boundary('=') }})(?!\s*(?:{{ token_boundary(':') }}|(?:abstract|constructor|data|field|instance|macro|module|mutual|opaque|postulate|primitive|private|record|variable|where|let){{ token_boundary_end }}|{{ token_boundary('(?:[\\λ∀]|->|→)') }}))((({{ NAME_TOKEN }}|_)\s+)+?)(:){{ token_boundary_end }}
    while: (^|\G)(?:\2(?=\s)|(?={{ STRING_CONTINUATION_START }}))
    name: meta.declaration.function.agda
    beginCaptures:
      3:
        patterns:
          - include: "#agda_comments"
          - include: "#term_name"
      7:
        name: keyword.operator.colon.agda
    patterns:
      - include: "#term_type_signature_content"

  term_type_signature_colon_on_separate_line:
    begin: {{ statement_boundary_start }}(\s*)(:){{ token_boundary_end }}
    while: (^|\G)(?:\2|(?={{ STRING_CONTINUATION_START }}))
    name: meta.declaration.function.agda
    beginCaptures:
      4:
        name: keyword.operator.colon.agda
    patterns:
      - include: "#term_type_signature_content"

  term_definition_equals_on_first_line:
    match: {{ statement_boundary_start }}(\s*)(\S.*)\s+(=){{ token_boundary_end }}
    name: meta.declaration.function.agda
    captures:
      3:
        patterns:
          - include: "#agda_syntax"
          - include: "#term_name"
      4:
        name: keyword.operator.agda

  lambda_abstraction_start:
    begin: {{ token_boundary('(\\\\|λ)') }}
    end: {{ token_boundary('((->|→)|(where))') }}|({{ absurd_pattern }})|(?=\s*\{(?!\{)(?!\s*{{ BINDER_LABELS }}\s*(?<!-)\})(?!{{ TYPED_PARAMETER_PATTERN }}{{ token_boundary(':') }}))
    beginCaptures:
      1: { name: keyword.operator.lambda.agda }
    endCaptures:
      2: { name: keyword.operator.lambda.mapsto.agda }
      3: { name: keyword.control.where.lambda.agda }
      4: { name: keyword.operator.lambda.absurd.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#binder_declaration"
      - include: "#agda_expressions"
      - include: "#variable_label"

  forall_abstraction_start:
    begin: {{ token_boundary('(forall|∀)') }}
    end: {{ token_boundary('((->|→))') }}
    beginCaptures:
      1: { name: keyword.operator.forall.agda }
    endCaptures:
      1: { name: keyword.operator.forall.mapsto.agda }
    name: meta.declaration.parameters.forall.agda
    patterns:
      - include: "#agda_comments"
      - include: "#binder_declaration"
      - include: "#typed_parameter_parenthesized_expression"
      - include: "#agda_expressions"
      - include: "#variable_label"

  typed_parameter_declaration:
    begin: (\()(?!{{ VARIABLE_SIGNATURE_CHAR }}*{{ token_boundary('=') }})({{ TYPED_PARAMETER_PATTERN }}){{ token_boundary('(:)') }}
    end: \)
    beginCaptures:
      1: { name: punctuation.section.parens.explicit.begin.agda }
      2:
        name: meta.declaration.parameters.explicit.pattern.agda
        patterns:
          - include: "#variable_label"
          - include: "#agda_syntax"
      3: { name: keyword.operator.colon.agda }
    endCaptures:
      0: { name: punctuation.section.parens.explicit.end.agda }
    name: meta.declaration.parameters.explicit.agda
    patterns:
      - include: "#agda_comments"
      - include: "#typed_parameter_declaration"
      - include: "#typed_parameter_parenthesized_expression"
      - include: "#parameter_declaration"
      - include: "#agda_syntax"
      - include: "#type"

  multiline_parameter_declaration:
    begin: (\{\{|\(|\{|{{ INSTANCE_ARGUMENT_START }})(?=(\s*{{ BINDER_LABELS }})\s*$)
    end: \}\}|[)}]|{{ INSTANCE_ARGUMENT_END }}
    beginCaptures:
      1: { name: punctuation.section.parens.begin.agda }
      2:
        name: meta.declaration.parameters.pattern.agda
        patterns:
          - include: "#variable_label"
          - include: "#agda_syntax"
    endCaptures:
      0: { name: punctuation.section.parens.end.agda }
    name: meta.declaration.parameters.agda
    patterns:
      - include: "#type"

  typed_parameter_parenthesized_expression:
    begin: \(
    end: \)
    patterns:
      - include: "#agda_comments"
      - include: "#typed_parameter_parenthesized_expression"
      - include: "#parameter_declaration"
      - include: "#agda_syntax"
      - include: "#type"

  record_expression:
    begin: {{ token_boundary('(record)') }}(\s*)(\{)
    end: \}
    name: meta.expression.record.agda
    beginCaptures:
      1: { name: keyword.control.record.agda }
      3: { name: punctuation.section.braces.begin.agda }
    endCaptures:
      0: { name: punctuation.section.braces.end.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#agda_syntax"
      - include: "#agda_token"

  discard:
    name: variable.language.discard.agda
    match: {{ token_boundary('_') }}

  wildcard:
    name: variable.language.wildcard.agda
    match: {{ token_boundary('_') }}

  dot_pattern:
    patterns:
      - include: "#dot_pattern_single_token"
      - include: "#dot_pattern_parenthesized"

  dot_pattern_single_token:
    match: {{ token_boundary_start }}(?<!\.)(\.)\s*({{ NAME_QUALIFIED }}){{ name_qualified_boundary_end }}
    name: meta.block.dot_pattern.agda
    captures:
      1: { name: keyword.operator.dot_pattern.period.agda }
      2:
        patterns:
          - include: "#dot_pattern_qualified_name"

  dot_pattern_parenthesized:
    begin: {{ token_boundary_start }}(?<!\.)(\.)\s*(\() #! there can be a newline before the opening parenthesis
    end: \)
    name: meta.block.dot_pattern.agda
    beginCaptures:
      1: { name: keyword.operator.dot_pattern.period.agda}
      2: { name: punctuation.definition.dot_pattern.begin.agda }
    endCaptures:
      0: { name: punctuation.definition.dot_pattern.begin.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#dot_pattern_internal_parentheses"

  dot_pattern_internal_parentheses:
    comment: Ensures that we match the correct closing parenthesis
    begin: \(
    end: \)
    patterns:
      - include: "#agda_comments"
      - include: "#dot_pattern_internal_parentheses"
      - include: "#dot_pattern_qualified_name"
      - include: "#agda_syntax"

  dot_pattern_qualified_name:
    match: {{ NAME_QUALIFIED }}
    captures:
      0:
        patterns:
          - include: "#agda_names_syntactic_sugar"
          - name: keyword.operator.dot_pattern.period.agda
            match: \.
          - name: comment.block.dot_pattern.agda
            match: {{ NAME_TOKEN }}

  illegal_name_parts:
    name: invalid.illegal.name.part.keyword.agda
    match: ({{ name_part_boundary('([;=|→:?\\\\λ∀\'⦇⦈⦃⦄]|->|--|' + RESERVED_NAME_PART + ')') }})

  illegal_unqualified_name_parts:
    name: invalid.illegal.name.part.keyword.agda
    match: (?<!\.){{ name_part_boundary('constructor') }}

  name_part:
    match: {{ name_part }}
    captures:
      0:
        patterns:
          - name: keyword.operator.overloaded.agda
            match: {{name_part_boundary('(<-|←)')}}
          - include: "#illegal_unqualified_name_parts"
          - include: "#illegal_name_parts"

  name_token:
    match: {{ name_token }}
    captures:
      0:
        patterns:
          - include: "#name_part"
          - include: "#agda_builtin"
          - name: variable.language.placeholder.agda
            match: _

  qualified_name:
    match: {{ name_qualified }}
    captures:
      0:
        patterns:
          - include: "#agda_names_syntactic_sugar"
          - name: punctuation.separator.period.agda
            match: \.
          - include: "#name_token"

  module_label:
    patterns:
      - include: "#discard"
      - match: {{ name_qualified }}
        captures:
          0:
            name: entity.name.namespace.agda
            patterns:
              - include: "#qualified_name"

  variable_label:
    patterns:
      - include: "#discard"
      - name: variable.parameter.term.agda
        match: {{ name_token }}
        captures:
          0:
            patterns:
              - include: "#agda_constants"
              - include: "#name_token"

  term_name:
    match: {{ token_boundary('(' + NAME_TOKEN + '|_)') }}
    captures:
      0:
        patterns:
          - include: "#discard"
          - include: "#name_token"

  hole:
    patterns:
      - match: {{ token_boundary('\?') }}
        name: variable.language.questionmark.agda
        captures:
          0: { name: punctuation.hole.questionmark.agda }
      - include: "#hole_parenthesized"

  hole_parenthesized:
    name: meta.block.hole.agda
    contentName: meta.block.hole.content.agda
    begin: \{\!
    end: \!\}
    beginCaptures:
      0: { name: punctuation.definition.hole.begin.agda }
    endCaptures:
      0: { name: punctuation.definition.hole.end.agda }
    patterns:
      - include: "#agda_comments"
      - include: "#hole_parenthesized"
      - include: "#agda_syntax"
      - include: "#agda_token"

  pragma:
    name: meta.preprocessor.pragma.block.agda
    contentName: meta.preprocessor.pragma.block.content.agda
    begin: "{-#"
    captures:
      0: { name: punctuation.definition.pragma.agda }
    end: "#-}"

  block_comment:
    name: comment.block.agda
    begin: \{-
    end: -\}
    beginCaptures:
      0: { name: punctuation.definition.comment.agda }
    endCaptures:
      0: { name: punctuation.definition.comment.agda }
    patterns:
      - include: "#block_comment"

  dash_comment:
    name: comment.line.double_dash.agda
    match: {{ token_boundary_start }}(--).*$
    captures:
      1: { name: punctuation.definition.comment.agda }

  escape_character:
    name: constant.character.escape.agda
    match: \\({{ ESCAPE_CODE }})

  escape_control_character:
    name: constant.character.escape.control.agda
    match: {{ ESCAPE_CONTROL_CODE }}

  string_gap_line:
    match: ^(\s*)(\\)(\s*)(\\)
    captures:
      2: { name: constant.character.escape.string-gap.agda }
      4: { name: constant.character.escape.string-gap.agda }

  agda_literals:
    patterns:
      - name: string.quoted.double.agda
        begin: \"
        end: \"
        beginCaptures:
          0: { name: punctuation.definition.string.begin.agda }
        endCaptures:
          0: { name: punctuation.definition.string.end.agda }
        patterns:
          - include: "#string_gap_line"
          - include: "#escape_character"
          - include: "#escape_control_character"
      - name: constant.character.quoted.single.agda
        begin: {{ token_boundary_start }}\'
        end: \'
        beginCaptures:
          0: { name: punctuation.definition.character.begin.agda }
        endCaptures:
          0: { name: punctuation.definition.character.end.agda }
        patterns:
          - include: "#escape_character"
          - include: "#escape_control_character"
      - name: constant.numeric.integer.agda
        match: {{ token_boundary('(' + NUMERIC_INTEGER + ')') }}
      - name: constant.numeric.float.agda
        match: {{ token_boundary('(' + NUMERIC_FLOAT + ')') }}

  agda_builtin:
    patterns:
      - name: support.type.sort.agda
        match: {{ token_boundary('((SSet|Set|Prop)(?:ω)?([0-9]*|[₀-₉]*))') }}
      - name: support.type.level.agda
        match:  {{ token_boundary('LevelUniv') }}
      - name: support.type.interval.agda
        match:  {{ token_boundary('Level') }}
      - name: support.type.interval.agda
        match:  {{ token_boundary('IUniv') }}
      # - name: support.class.interval.agda
      #   match:  {{ token_boundary('I') }}

  agda_simple_blocks:
    patterns:
{% for block_keyword in ["abstract", "field", "instance", "macro", "mutual", "opaque", "postulate", "primitive", "private", "variable", "where"] %} # TODO: do, let
      - comment: {{ block_keyword }} block #TODO: continue working on this
        begin: {{ statement_boundary_start }}(\s*)({{ block_keyword }}){{ token_boundary_end }}
        while: (^|\G)(?:\2(?=\s)|\s*$)
        name: meta.block.{{block_keyword}}.agda
        beginCaptures:
          3: { name: keyword.control.{{block_keyword}}.agda }
        patterns:
          - include: "#the_usual"
{% endfor %}

  agda_block_declarations:
    patterns:
      - include: "#module_declaration"
      - include: "#data_declaration"
      - include: "#data_declaration_name_on_separate_line"
      - include: "#record_declaration"
      - include: "#record_declaration_name_on_separate_line"

  agda_layout_blocks:
    patterns:
      - include: "#agda_block_declarations"
      - include: "#infix_block" #! Not documented as a layout block
      - include: "#constructor_block"
      - include: "#agda_simple_blocks"

  agda_comments:
    patterns:
    - include: "#block_comment"
    - include: "#dash_comment"

  agda_preprocessing_syntax:
    patterns:
      - include: "#pragma"
      - include: "#agda_comments"

  agda_constants:
    patterns:
      - include: "#agda_literals"
      - include: "#agda_builtin"

  # Names with special meaning for certain notations
  # https://agda.readthedocs.io/en/latest/language/syntactic-sugar.html
  agda_names_syntactic_sugar:
    patterns:
      - match: {{name_qualified_boundary('(_?)(>>=?)(_?)')}}
        captures:
          1:
            name: variable.language.wildcard.agda
          2:
            name: support.function.monad.agda
          3:
            name: variable.language.wildcard.agda
      - match: {{name_qualified_boundary('(_?)(<*>|<\|>)(_?)')}}
        captures:
          1:
            name: variable.language.wildcard.agda
          2:
            name: support.function.applicative_functor.agda
          3:
            name: variable.language.wildcard.agda
      - name: support.function.applicative_functor.agda
        match: {{name_qualified_boundary('pure|empty')}}

  agda_modality:
    match: (@)({{ AGDA_MODALITY }}){{ token_boundary_end }}
    captures:
      1: { name: keyword.operator.attribute.agda }
      2: { name: keyword.control.attribute.agda }

  agda_attributes:
    begin: {{ token_boundary_start }}\@
    end: {{ NAME_QUALIFIED }}{{ token_boundary_end }}
    beginCaptures:
      0: { name: keyword.operator.attribute.agda }
    captures:
      0: { name: meta.attribute.agda }
    endCaptures:
      0: { name: keyword.control.attribute.agda }
    patterns:
      - include: "#agda_comments"

  agda_expression_keywords:
    patterns:
    - include: "#agda_attributes"
    - match: {{token_boundary('(forall|->|[∀→\\\\λ])')}}|({{ absurd_pattern }})
      captures:
        1: { name: keyword.operator.agda }
        2: { name: keyword.operator.absurd.agda }

  agda_keywords:
    patterns:
      - include: "#agda_expression_keywords"
      - name: keyword.operator.agda
        match: {{ token_boundary('([=|:←⦇⦈⦃⦄]|<-|\.\.\.?)') }}|\@
      - name: keyword.control.agda
        match: {{ token_boundary('(abstract|constructor|do|field|forall|import|in|infix[lr]?|instance|interleaved|let|macro|module|mutual|opaque|open|pattern|postulate|primitive|record|rewrite|syntax|tactic|unfolding|variable|where|with)') }}
      - name: storage.modifier.agda
        match: {{ token_boundary('((co)?inductive|(no-)?eta-equality|private|public)') }}
      - name: keyword.control.agda
        match: {{ token_boundary('(overlap|quote(Term)?|unquote(Decl|Def)?)') }}
      - name: keyword.control.import.agda
        match: {{ token_boundary('(hiding|public|renaming|using)') }}

  agda_token:
    patterns:
      - include: "#agda_constants"
      - include: "#agda_keywords"
      - include: "#qualified_name"

  agda_expressions:
    patterns:
      - include: "#hole"
      - include: "#record_expression"
      - include: "#forall_abstraction_start"
      - include: "#lambda_abstraction_start"
      - include: "#agda_modality"
      - include: "#agda_constants"
      - include: "#wildcard"
      - include: "#agda_expression_keywords"


  agda_syntax:
    patterns:
      - include: "#agda_preprocessing_syntax"
      - include: "#agda_expressions"
      - include: "#dot_pattern"
      - include: "#agda_keywords"


  agda_statements:
    patterns:
      - include: "#open_module_statement"
      - include: "#open_import_statement"
      - include: "#open_statement"
      - include: "#hidden_argument_type_signature"
      - include: "#term_type_signature_colon_on_first_line"
      - include: "#term_type_signature_colon_on_separate_line"
      # - include: "#term_definition_equals_on_first_line"


  the_usual:
    patterns:
      - include: "#agda_preprocessing_syntax"
      - include: "#agda_statements"
      - include: "#agda_layout_blocks"
      - include: "#agda_syntax"
      - include: "#agda_token"

      - comment: misplaced keywords
        name: invalid.illegal.keyword.agda
        match: {{ token_boundary('(data|module|record|where)') }}
